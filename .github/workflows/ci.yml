name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK the project is developed and tested against.
          flutter-version: 3.41.2
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  android-release-size:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK the project is developed and tested against.
          flutter-version: 3.41.2
          cache: true
      - run: flutter pub get
      # CI builds are signed with the debug key; release signing lives in the
      # store pipeline (see RELEASE.md).
      - run: flutter build appbundle --release
      - run: flutter build apk --release --target-platform android-arm64
      - name: Report artifact size
        run: |
          BUNDLE=build/app/outputs/bundle/release/app-release.aab
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "### Release artifact sizes" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`.aab\`: $(du -h "$BUNDLE" | cut -f1) (Play upload; per-device download is smaller after splits)" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`.apk\` (arm64): $(du -h "$APK" | cut -f1) (installable, uploaded as workflow artifact)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
